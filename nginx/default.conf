upstream django_daphne {
    server web:8000;
}

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    server_name fleetops.local *.fleetops.local;
    return 301 https://$host$request_uri;
}

# 2. Main HTTPS Server
server {
    listen 443 ssl;
    server_name fleetops.local *.fleetops.local;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # LOAD MIME TYPES (Crucial: prevents Chrome from blocking CSS)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SERVE STATIC FILES (Django Admin CSS/JS)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # WEBSOCKETS (Live Telemetry)
    location /ws/ {
        proxy_pass http://django_daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # APP & API TRAFFIC
    location / {
        proxy_pass http://django_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}